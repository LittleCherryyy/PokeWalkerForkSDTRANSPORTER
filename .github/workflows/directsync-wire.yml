name: Direct Sync wire contract

on:
  push:
    paths:
      - 'core/android/app/src/main/java/io/github/sdtransporter/pokewalker/DirectSyncProtocol.java'
      - 'core/tools/DirectSyncWireContractTest.java'
      - 'core/bootstrap/retail/transport/**'
      - 'core/bootstrap/retail/common/include/walker_directsync.h'
      - 'core/tools/test_walker_push_stream.c'
      - 'core/tools/test_walker_direct_lock.c'
      - 'core/tools/test_walker_direct_lock_cpp.cpp'
      - 'core/bootstrap/retail/common/include/walker_direct_lock.h'
      - '.github/workflows/directsync-wire.yml'
  pull_request:
    paths:
      - 'core/android/app/src/main/java/io/github/sdtransporter/pokewalker/DirectSyncProtocol.java'
      - 'core/tools/DirectSyncWireContractTest.java'
      - 'core/bootstrap/retail/transport/**'
      - 'core/bootstrap/retail/common/include/walker_directsync.h'
      - 'core/tools/test_walker_push_stream.c'
      - 'core/tools/test_walker_direct_lock.c'
      - 'core/tools/test_walker_direct_lock_cpp.cpp'
      - 'core/bootstrap/retail/common/include/walker_direct_lock.h'
      - '.github/workflows/directsync-wire.yml'
  workflow_dispatch:

jobs:
  wire-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate 64 KiB DSi -> Android PUSH framing, CRC and ACK
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pw-wire"
          javac -d "$RUNNER_TEMP/pw-wire" \
            core/android/app/src/main/java/io/github/sdtransporter/pokewalker/DirectSyncProtocol.java \
            core/tools/DirectSyncWireContractTest.java
          java -cp "$RUNNER_TEMP/pw-wire" \
            io.github.sdtransporter.pokewalker.DirectSyncWireContractTest
      - name: Validate bounded C checkout sender against partial TCP I/O
        shell: bash
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Wno-unused-function \
            -I core/bootstrap/retail/common/include \
            -I core/bootstrap/retail/transport \
            core/bootstrap/retail/transport/walker_push_stream.c \
            core/tools/test_walker_push_stream.c \
            -o "$RUNNER_TEMP/pw-push-stream-test"
          "$RUNNER_TEMP/pw-push-stream-test" "$RUNNER_TEMP/pw-c-outbound.bin"
      - name: Interoperate real C sender framing with Java Android decoder
        shell: bash
        run: |
          java -cp "$RUNNER_TEMP/pw-wire" \
            io.github.sdtransporter.pokewalker.DirectSyncWireContractTest \
            "$RUNNER_TEMP/pw-c-outbound.bin" \
            "$RUNNER_TEMP/pw-android-ack.bin"
      - name: Verify Android-authored ACK with native C transaction state machine
        shell: bash
        run: |
          "$RUNNER_TEMP/pw-push-stream-test" --android-ack \
            "$RUNNER_TEMP/pw-android-ack.bin"
      - name: Validate durable pre-send DSi ownership fence
        shell: bash
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Wno-unused-function \
            -I core/bootstrap/retail/common/include \
            core/tools/test_walker_direct_lock.c \
            -o "$RUNNER_TEMP/pw-direct-lock-test"
          "$RUNNER_TEMP/pw-direct-lock-test"
      - name: Verify C++ launcher ownership-fence ABI
        shell: bash
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -Wno-unused-function \
            -I core/bootstrap/retail/common/include \
            core/tools/test_walker_direct_lock_cpp.cpp \
            -o "$RUNNER_TEMP/pw-direct-lock-cpp-test"
          "$RUNNER_TEMP/pw-direct-lock-cpp-test"
