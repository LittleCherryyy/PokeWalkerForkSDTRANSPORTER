# This smoke check intentionally delegates to the proven, pinned NTR pipeline.
# The resulting nds-bootstrap is compile-tested only; it is NOT a safe
# in-game Wi-Fi transfer release and must not be published as one.
name: Experimental DSi bootstrap compile (NTR smoke check)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/experimental-bootstrap-build.yml'
jobs:
  compile:
    name: Pinned legacy NTR source build (not hardware validated)
    uses: ./.github/workflows/pokewalker-ntr-build.yml
