name: Experimental DSi bootstrap build (unverified)
on:
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
      - name: Inspect legacy toolchain
        shell: bash
        run: |
          set -euxo pipefail
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          command -v ndstool
          test -f /opt/devkitpro/libnds/lib/libnds9.a
          test -f /opt/devkitpro/libnds/lib/libnds7.a
          test -f /opt/devkitpro/libnds/lib/libfat.a
      - name: Generate walker payload and build retail bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO=/opt/devkitpro
          export LEGACY_DEVKITARM=/opt/devkitpro/devkitARM
          export LEGACY_LIBNDS=/opt/devkitpro/libnds
          export PATH="$LEGACY_DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          cc core/bootstrap/lzss.c -O2 -o core/bootstrap/lzss
          python3 core/bootstrap/build_walker.py
          make -C core/bootstrap/retail -j2 \
            DEVKITARM="$GITHUB_WORKSPACE/core/bootstrap/portable-ds-rules" \
            LEGACY_DEVKITARM="$LEGACY_DEVKITARM" \
            LEGACY_LIBNDS="$LEGACY_LIBNDS" LIBDIRS="$LEGACY_LIBNDS" \
            PYTHON=python3 GIT_VER=experimental \
            LZSS="$GITHUB_WORKSPACE/core/bootstrap/lzss" all
          test -s core/bootstrap/retail/bin/nds-bootstrap.nds
      - name: Upload candidate (not validated on hardware)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nds-bootstrap-experimental-unverified
          path: core/bootstrap/retail/bin/nds-bootstrap.nds
          if-no-files-found: error
