              print(2,0,(const unsigned char*)"Virtual Slot-2",FONT_WHITE,false);
              printDec(2,2,idx+1,3,FONT_WHITE,false);printDec(8,2,count,3,FONT_WHITE,false);
              print(2,4,(const unsigned char*)"GBA ROM:",FONT_LIGHT_BLUE,false);print(2,5,names,FONT_WHITE,false);
              print(2,7,(const unsigned char*)"GBA SAVE:",FONT_LIGHT_BLUE,false);print(2,8,names+32,FONT_WHITE,false);
              print(2,12,(const unsigned char*)"Left/Right: select",FONT_WHITE,false);
              print(2,14,(const unsigned char*)"A: Apply & restart",FONT_WHITE,false);
              print(2,15,(const unsigned char*)"B: Cancel",FONT_WHITE,false);
              print(2,18,(const unsigned char*)"Save DS game before swap.",FONT_LIGHT_GRAY,false);
              waitKeys(KEY_LEFT|KEY_RIGHT|KEY_UP|KEY_DOWN|KEY_A|KEY_B);
              if(KEYS&KEY_B)return false;
              if(KEYS&KEY_A) {
                if(!boolQuestion((const unsigned char*)"Restart with this cartridge?"))continue;
                swapCommand(0x50415753,idx,0);
                if(sharedAddr[0])return true;
                clearScreen(false);print(2,8,(const unsigned char*)"Swap failed. Save pending?",FONT_RED,false);
                print(2,10,(const unsigned char*)"B: Back",FONT_WHITE,false);waitKeys(KEY_B);return false;
              }
              if(KEYS&(KEY_LEFT|KEY_UP))idx=(idx+count-1)%count;
              else if(KEYS&(KEY_RIGHT|KEY_DOWN))idx=(idx+1)%count;
            }
          }
          static void drawMainMenu(MenuItem *menuItems, int menuItemCount) {''')
          replace(igm,'if(igmText.rtl)\n\t\t\tprintRight(0x1D, i, igmText.menu[menuItems[i]], FONT_WHITE, false);','if(menuItems[i]==MENU_SWAP) print(2,i,(const unsigned char*)"Virtual Slot-2",FONT_WHITE,false);\n\t\telse if(igmText.rtl)\n\t\t\tprintRight(0x1D, i, igmText.menu[menuItems[i]], FONT_WHITE, false);')
          replace(igm,'MenuItem menuItems[8];','MenuItem menuItems[9];')
          replace(igm,'menuItems[menuItemCount++] = MENU_QUIT;','if(!exception){swapCommand(0x54435753,0,0);if(sharedAddr[0]>0&&sharedAddr[0]<=96)menuItems[menuItemCount++]=MENU_SWAP;}\n\tmenuItems[menuItemCount++] = MENU_QUIT;')
          replace(igm,'case MENU_RESET:\n\t\t\t\t\tif (boolQuestion(igmText.resetGameMessage)) {','case MENU_SWAP:\n\t\t\t\t\tif(swapMenu())sharedAddr[4]=0x42525753;\n\t\t\t\t\tbreak;\n\t\t\t\tcase MENU_RESET:\n\t\t\t\t\tif (boolQuestion(igmText.resetGameMessage)) {')
          # All three paths hold the same save mutex; reuse one sector scratch.
          replace(flush,'static aFile slot2Save;','#ifndef TWLSDK\nstatic u32 nbpSector[128] __attribute__((aligned(4)));\n#endif\nstatic aFile slot2Save;')
          replace(flush,'static unsigned char snapshot[512] __attribute__((aligned(4)));','unsigned char *snapshot=(unsigned char*)nbpSector;')
          replace(flush,'static u32 rec[128] __attribute__((aligned(4)));','u32 *rec=nbpSector;')
          subprocess.run(['git','-C','upstream','add','-N',str(swap.relative_to(root))],check=True)
          subprocess.run(['git','-C','upstream','add','-N',str(hdr.relative_to(root))],check=True)
          pathlib.Path('out/integration.patch').write_bytes(subprocess.check_output(['git','-C','upstream','diff','--binary']))
          # Regression: the old partial-sector return count rejects this real blob.
          start=32; length=len(code); first=min(length,512-start)
          whole=(length-first)//512*512; prefix=first+whole
          assert prefix==7136 and prefix+length==14708
          # Verify the exact chunk boundaries, data reconstruction and CRC.
          pos=0; chunks=[]; rebuilt=bytearray()
          while pos<len(code):
              n=min(512-((32+pos)&511),len(code)-pos)
              assert 0<n<=512 and (32+pos)//512==(32+pos+n-1)//512
              rebuilt+=pkg[32+pos:32+pos+n];chunks.append(n);pos+=n
          assert chunks[0]==480 and chunks[-1]==436 and rebuilt==code
          assert zlib.crc32(rebuilt)==0x7a10ef46
          print('Pinned sources verified; sector regression passed:',chunks)
          PY
      - name: Build in documented legacy SDK
        shell: bash
        run: |
          set -euo pipefail
          cc -static -O2 upstream/bootstrap/lzss.c -o out/lzss
          file out/lzss
          docker pull devkitpro/devkitarm:20241104
          docker image inspect devkitpro/devkitarm:20241104 --format '{{json .RepoDigests}}' > out/image-digest.json
          docker run --rm -v "$PWD:/src" -w /src/upstream/bootstrap devkitpro/devkitarm:20241104 bash -ec '
            export DEVKITPRO=/opt/devkitpro
            export PATH="$DEVKITPRO/devkitARM/bin:$DEVKITPRO/tools/bin:$PATH"
            arm-none-eabi-gcc --version
            [[ $(arm-none-eabi-gcc -dumpfullversion) == 14.2.* ]]
            find retail -type d -name build -prune -exec rm -rf {} +
            find retail -type f \( -name "*.o" -o -name "*.elf" -o -name "*.d" \) -delete
            rm -f retail/bin/nds-bootstrap.nds
            test -x /src/out/lzss
            make -C retail -j2 DEVKITARM="$PWD/portable-ds-rules" LEGACY_DEVKITARM="$DEVKITPRO/devkitARM" LEGACY_LIBNDS="$DEVKITPRO/libnds" LIBDIRS="$DEVKITPRO/libnds" PYTHON=python3 GIT_VER=nbp012 LZSS=/src/out/lzss all
            for d in bootloader bootloader2 bootloaderi bootloaderi2; do
              arm-none-eabi-nm -n retail/$d/*.elf > /src/out/$d.symbols
            done
          ' 2>&1 | tee out/build.log
      - name: Validate and package test candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, struct, zlib, hashlib, json, shutil
          out=pathlib.Path('out'); root=pathlib.Path('upstream/bootstrap/retail')
          nds=root/'bin/nds-bootstrap.nds'; b=nds.read_bytes()
          assert len(b)>=512 and b[12:16]==b'KBSE'
          for off in (0x20,0x30):
            start,entry,dest,size=struct.unpack_from('<4I',b,off)
            assert size and start>=512 and start+size<=len(b) and dest<=(entry&~1)<dest+size
          p=(out/'virtual_slot2.nbp').read_bytes()
          assert len(p)==7604 and struct.unpack_from('<4s7I',p)==(b'NBP2',1,32,0x4d453253,0,7572,0x7a10ef46,0) and zlib.crc32(p[32:])==0x7a10ef46
          gaps={}
          for d in ('bootloader','bootloader2','bootloaderi','bootloaderi2'):
            s={x[2]:int(x[0],16) for l in (out/(d+'.symbols')).read_text().splitlines() if len(x:=l.split())==3}
            gaps[d]=s['__sp_usr']-s['__bss_end']
            assert gaps[d]>=4096,(d,gaps[d])
            if d=='bootloaderi': assert 'slot2EmuBoot' in s and 'slot2EmuBlob' not in s
          target=out/'DSi-test'; plug=target/'_nds/nds-bootstrap/plugins';plug.mkdir(parents=True)
          shutil.copyfile(nds,target/'_nds/nds-bootstrap-nightly.nds')
          shutil.copyfile(out/'virtual_slot2.nbp',plug/'virtual_slot2.nbp')
          shutil.copyfile(out/'integration.patch',target/'integration.patch')
          for name in ('LICENSE','CREDITS.md'):
            shutil.copyfile(pathlib.Path('upstream')/name,target/name)
          (target/'slot2.ini.example').write_text('[SLOT2]\nGBA_ROM_PATH = sd:/roms/gba/Pokemon Emerald.gba\nGBA_SAV_PATH = sd:/roms/gba/saves/Pokemon Emerald.sav\nWRITEBACK = 1\n')
          # Use upstream per-path opt-in; no change to verification or signature rules.
          pearl='sd:/roms/nds/Pokemon - Pearl Version (patched).nds'
          key=hashlib.sha1(pearl.encode()).hexdigest()
          (target/'migration.ini.example').write_text('['+key+']\nBYPASS_LIMITS = 1\n')
          (target/'TEST-ONLY.txt').write_text('NBP012: DSi internal SD; Diamond/Pearl/Platinum/HeartGold/SoulSilver, Ruby/Sapphire/Emerald/FireRed/LeafGreen families, regional builds accepted but not hardware validated. Prefer same-language games. GBA save: 131072 bytes or 131088 with RTC. BACK UP BOTH SAVES, use disposable copies, Nightly bootstrap. Compare boot without plugin, then with plugin. Check MIGRATE FROM the chosen GBA game and list only. Normal boot is direct; hold SELECT at checkpoint for diagnostic screen. Save DS game before opening in-game menu. Virtual Slot-2 lists up to 96 ROM/save pairs; A confirms, checks old GBA flush and reboots the same title. On restart the launcher validates the request and updates slot2.ini. Keep backups; experimental hardware validation required. Send NBP012-BOOT.TXT and NDSBTSRP.LOG from SD root plus slot2-error.txt or slot2-status.txt in _nds/nds-bootstrap/. Optional history bypass for verified supported Diamond/Pearl/Platinum revisions: copy migration.ini.example as sd:/_nds/nds-bootstrap/migration.ini (merge rather than overwrite existing entries). Example matches the exact patched Pearl path from the hardware report. Launcher checks title/revision/header CRC; bootloader requires a unique exact ARM9 routine signature. No global clock changes. Writeback defaults ON in this test build; WRITEBACK = 0 disables it. Select a disposable GBA save in slot2.ini. No filename or backup-file requirement. Send the NBP012.BIN from the SD root, captured after the migration and after waiting at least five seconds in-game. It records live ARM9 and ARM7 counters. Back up the DS save too. On the diagnostic screen verify Writeback test: 1. Migrate only on disposable copies, finish Pal Park, save in-game, wait for idle writes and compare GBA save after shutdown. This is not an atomic cross-save transaction; power loss/IO errors may leave a partial write. Keep originals untouched. Not hardware validated. Original SD-Transporter and nds-bootstrap contributors credited in CREDITS.md. Source base: 75610fa9905ac252609081287121e8d4c44febed; corresponding changes in integration.patch.\n')
          (target/'build-report.json').write_text(json.dumps({'hardware_tested':False,'build':'NBP012','writeback':'default on for test; WRITEBACK=0 disables; checked 512-byte write/readback and runtime telemetry','ds_families':['ADA','APA','CPU','IPK','IPG'],'gba_families':['AXV','AXP','BPE','BPR','BPG'],'loader_static_stack_margins':gaps,'nds_sha256':hashlib.sha256(b).hexdigest(),'plugin_sha256':hashlib.sha256(p).hexdigest()},indent=2))
          (target/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+str(f.relative_to(target))+'\n' for f in sorted(target.rglob('*')) if f.is_file() and f.name!='SHA256SUMS.txt'))
          print(gaps)
          PY
