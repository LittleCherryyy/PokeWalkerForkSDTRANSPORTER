name: Pokewalker Android receiver debug compile (not a release)

on:
  push:
    branches: ["dev/v72-resident-ping-core"]
    paths:
      - "core/android/**"
      - ".github/workflows/pokewalker-android-build.yml"
  pull_request:
    paths:
      - "core/android/**"
      - ".github/workflows/pokewalker-android-build.yml"
  workflow_dispatch:

jobs:
  android-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The fork does not track gradle-wrapper.jar. Install the pinned
      # Gradle distribution explicitly rather than invoking a missing jar.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      # GitHub ubuntu-latest has Android command-line tools preinstalled.
      # Avoid setup-android@v3's retired "tools" package installation,
      # which fails before Gradle starts on current SDK repositories.
      - name: Install exact SDK and native receiver build requirements
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          printf 'Android SDK: %s\\n' "$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Compile Java, resources and native EEPROM parser together
        shell: bash
        run: |
          set -euo pipefail
          cd core/android
          gradle --no-daemon --console=plain :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "Android receiver debug APK compiled; not published or installed."
