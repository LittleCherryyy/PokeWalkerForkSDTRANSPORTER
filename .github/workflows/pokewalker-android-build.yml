name: Pokewalker Android receiver debug compile (not a release)

on:
  push:
    branches: ["dev/v72-resident-ping-core"]
    paths:
      - "core/android/**"
      - ".github/workflows/pokewalker-android-build.yml"
  pull_request:
    paths:
      - "core/android/**"
      - ".github/workflows/pokewalker-android-build.yml"
  workflow_dispatch:

jobs:
  android-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install exact SDK and native receiver build requirements
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Compile Java, resources and native EEPROM parser together
        shell: bash
        run: |
          set -euo pipefail
          cd core/android
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "Android receiver debug APK compiled; not published or installed."
