name: Pokewalker NTR source build (not a playable transfer)

on:
  push:
    branches: ["dev/v72-resident-ping-core"]
    paths:
      - "core/bootstrap/**"
      - ".github/workflows/pokewalker-ntr-build.yml"
  pull_request:
    paths:
      - "core/bootstrap/**"
      - ".github/workflows/pokewalker-ntr-build.yml"
  workflow_dispatch:

jobs:
  native-arm-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned legacy SDK and portable rules
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          # NTR cardengine code depends on libnds 1.8.x / old fifomessages.h.
          # Modern devkitarm images remove this header; use the release's
          # pinned Docker toolchain and included portable Makefile rules.
          export DEVKITPRO=/opt/devkitpro
          export LEGACY_DEVKITARM=/opt/devkitpro/devkitARM
          export LEGACY_LIBNDS=/opt/devkitpro/libnds
          export DEVKITARM="$GITHUB_WORKSPACE/core/bootstrap/portable-ds-rules"
          export PATH="$LEGACY_DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          for var in DEVKITPRO LEGACY_DEVKITARM LEGACY_LIBNDS DEVKITARM; do
            echo "$var=${!var}" >> "$GITHUB_ENV"
          done
          echo "$LEGACY_DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"
          test -f "$LEGACY_LIBNDS/include/nds/fifomessages.h"
          "$LEGACY_DEVKITARM/bin/arm-none-eabi-gcc" --version | head -1
          # GCC is a host utility here, not the ARM compiler.
          if ! command -v gcc >/dev/null 2>&1; then
            # The frozen 2024 image still lists Debian 11 security package
            # revisions removed from the mirror. Use the stable bullseye
            # repository for native GCC; keep the pinned ARM SDK untouched.
            sed -i '/bullseye-security/d' /etc/apt/sources.list
            rm -rf /var/lib/apt/lists/*
            apt-get -o Acquire::http::No-Cache=true update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential
          fi
          gcc -O2 core/bootstrap/lzss.c -o /usr/local/bin/lzss
      - name: Rebuild injected original-IR ARM9 payload from source
        shell: bash
        run: |
          set -euo pipefail
          cd core/bootstrap/retail
          make walker_payload
      - name: Link resident NTR ARM7 (SD and durable lock)
        shell: bash
        run: |
          set -euo pipefail
          make -C core/bootstrap/retail cardenginei_arm7
      - name: Link resident NTR ARM9 (Pokewalker real PUSH coordinator)
        shell: bash
        run: |
          set -euo pipefail
          make -C core/bootstrap/retail cardenginei_arm9
      - name: Compile NTR bootloader with patched walker hook
        shell: bash
        run: |
          set -euo pipefail
          make -C core/bootstrap/retail/bootloaderi
      - name: Check nonempty native outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s core/bootstrap/retail/common/include/walker_payload.h
          test -s core/bootstrap/retail/nitrofiles_dec/cardenginei_arm7.bin
          test -s core/bootstrap/retail/nitrofiles_dec/cardenginei_arm9.bin
          echo "NTR code compiled. This does not establish in-game Wi-Fi."
