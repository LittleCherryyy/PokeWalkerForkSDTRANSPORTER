name: TWLM02 separate Pokemon ROM and save selector
on:
  push:
    branches: [experimental/nbp003-build-only]
    paths: [.github/workflows/twlm-gba-save-selector.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - theme: dsimenutheme
            target: dsimenu
          - theme: r4theme
            target: r4menu
          - theme: aktheme
            target: akmenu
    steps:
      - name: Fetch and patch pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          git init upstream
          git -C upstream remote add origin https://github.com/Shinygati/SD-Transporter.git
          git -C upstream fetch --depth=1 origin 75610fa9905ac252609081287121e8d4c44febed
          git -C upstream checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import pathlib, hashlib, subprocess
          root=pathlib.Path('upstream/TWiLightMenu-27.25.1')
          def check(p,sha):
              b=p.read_bytes()
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha,p
          def replace(p,a,b):
              t=p.read_text(); assert t.count(a)==1,(p,a); p.write_text(t.replace(a,b,1))
          h=root/'universal/include/common/pokeSlots.h'
          check(h,'8d43fa7b690fdb54963c5ffcbdbf4b3af902ceb0')
          replace(h,'#include <string>','#include <string>\n#include <vector>\n#include <algorithm>\n#include <dirent.h>')
          replace(h,'} // namespace pokeSlots',r'''/* TWLM02: ROM and save are independent choices; commit both only on Save+A. */
          struct GbaRom { std::string path; int family; };
          inline std::string baseName(const std::string& p) {
              const size_t slash=p.find_last_of('/');
              return slash==std::string::npos?p:p.substr(slash+1);
          }
          inline std::string parentDir(const std::string& p) {
              const size_t slash=p.find_last_of('/');
              return slash==std::string::npos?"":p.substr(0,slash);
          }
          inline int gbaFamily(const std::string& p) {
              if(p.compare(0,4,"sd:/")!=0) return -1;
              unsigned char h[0xC0];
              FILE* f=fopen(p.c_str(),"rb"); if(!f) return -1;
              bool ok=fread(h,1,sizeof(h),f)==sizeof(h); fclose(f);
              if(!ok||h[0xB2]!=0x96) return -1;
              static const char* const codes[]={"AXV","AXP","BPE","BPR","BPG"};
              for(int i=0;i<5;i++) if(!memcmp(h+0xAC,codes[i],3)) return i;
              return -1;
          }
          inline bool pokemonGbaSave(const std::string& p) {
              struct stat st;
              return p.compare(0,4,"sd:/")==0 && !stat(p.c_str(),&st) && S_ISREG(st.st_mode) &&
                     (st.st_size==0x20000||st.st_size==0x20010);
          }
          inline bool saveExtension(const std::string& n) {
              size_t d=n.find_last_of('.');
              if(d==std::string::npos||strncasecmp(n.c_str()+d,".sav",4)) return false;
              for(size_t i=d+4;i<n.size();i++) if(n[i]<'0'||n[i]>'9') return false;
              return true;
          }
          inline bool saveNameMatches(const std::string& name,const std::string& romStem) {
              if(!saveExtension(name)) return false;
              const std::string stem=withExtension(name,"");
              if(stem.size()<romStem.size()||strncasecmp(stem.c_str(),romStem.c_str(),romStem.size())) return false;
              if(stem.size()==romStem.size()) return true;
              const char sep=stem[romStem.size()];
              return sep==' '||sep=='-'||sep=='_'||sep=='.'||sep=='(';
          }
          inline int namedFamily(const std::string& name) {
              std::string n;
              for(unsigned char c:name) {
                  if(c>='A'&&c<='Z') c+='a'-'A';
                  if((c>='a'&&c<='z')||(c>='0'&&c<='9')) n+=(char)c;
              }
              if(n.compare(0,7,"pokemon")!=0) return -1;
              static const char* const names[]={"ruby","sapphire","emerald","firered","leafgreen"};
              for(int i=0;i<5;i++) if(n.compare(7,strlen(names[i]),names[i])==0) return i;
              return -1;
          }
          inline void uniquePath(std::vector<std::string>& v,const std::string& p) {
              if(p.empty()||p.compare(0,4,"sd:/")!=0) return;
              for(const auto& q:v) if(sameFile(p,q)) return;
              v.push_back(p);
          }
          inline void scanNames(const std::string& dir,std::vector<std::string>& dirs,std::vector<std::string>& files,unsigned depth) {
              if(depth>6||dirs.size()>=128||files.size()>=1024) return;
              for(const auto& d:dirs) if(sameFile(d,dir)) return;
              DIR* d=opendir(dir.c_str()); if(!d) return;
              dirs.push_back(dir);
              std::vector<std::string> children;
              struct dirent* e;
              while(files.size()<1024&&(e=readdir(d))) {
                  std::string n=e->d_name;
                  if(n=="."||n==".."||n.empty()||n[0]=='.'||n.find('/')!=std::string::npos) continue;
                  std::string p=dir+"/"+n;
                  struct stat st; if(stat(p.c_str(),&st)) continue;
                  if(S_ISDIR(st.st_mode)) {if(children.size()<128) children.push_back(p);continue;}
                  if(!S_ISREG(st.st_mode)) continue;
                  const size_t dot=n.find_last_of('.');
                  if(dot!=std::string::npos&&(!strcasecmp(n.c_str()+dot,".gba")||saveExtension(n))) uniquePath(files,p);
              }
              closedir(d);
              for(const auto& p:children) scanNames(p,dirs,files,depth+1);
          }
          inline std::string shortName(const std::string& path) {
              std::string n=withExtension(baseName(path),"");
              if(n.size()>=10&&!strncasecmp(n.c_str(),"Pokemon - ",10)) n=n.substr(10);
              size_t v=n.find(" Version"); if(v!=std::string::npos) n.erase(v,8);
              if(n.size()>23) n=n.substr(0,9)+"~"+n.substr(n.size()-13);
              return n;
          }
          struct GbaSelector {
              std::vector<GbaRom> roms;
              std::vector<std::string> allSaves,saves;
              std::string currentRom,currentSave;
              size_t ri=0,si=0;
              bool committed=false;
              std::string result;
              explicit GbaSelector(bool enabled) {
                  if(!enabled) return;
                  currentRom=readIni(kSlot2Ini,"SLOT2","GBA_ROM_PATH");
                  currentSave=readIni(kSlot2Ini,"SLOT2","GBA_SAV_PATH");
                  std::vector<std::string> dirs,files;
                  scanNames("sd:/roms/gba",dirs,files,0);
                  std::string rd=parentDir(currentRom),sd=parentDir(currentSave);
                  if(!rd.empty()&&rd!="sd:") scanNames(rd,dirs,files,0);
                  if(!sd.empty()&&sd!="sd:") scanNames(sd,dirs,files,0);
                  scanNames("sd:/_nds/TWiLightMenu/saves",dirs,files,0);
                  uniquePath(files,currentRom); uniquePath(files,currentSave);
                  std::sort(files.begin(),files.end(),[](const std::string&a,const std::string&b){return strcasecmp(a.c_str(),b.c_str())<0;});
                  for(const auto& p:files) {
                      std::string n=baseName(p);
                      if(n.size()>=4&&!strcasecmp(n.c_str()+n.size()-4,".gba")) {
                          int f=gbaFamily(p); if(f>=0) roms.push_back({p,f});
                      } else if(saveExtension(n)&&pokemonGbaSave(p)) allSaves.push_back(p);
                  }
                  for(size_t i=0;i<roms.size();i++) if(sameFile(roms[i].path,currentRom)) ri=i;
                  refreshSaves();
                  committed=!roms.empty()&&!saves.empty()&&sameFile(roms[ri].path,currentRom)&&sameFile(saves[si],currentSave);
              }
              int familyForSave(const std::string& p) const {
                  size_t best=0; int family=-1;
                  for(const auto& r:roms) {
                      const std::string stem=withExtension(baseName(r.path),"");
                      if(!saveNameMatches(baseName(p),stem)) continue;
                      if(stem.size()>best){best=stem.size();family=r.family;}
                      else if(stem.size()==best&&family!=r.family) family=-2;
                  }
                  return best?family:namedFamily(baseName(p));
              }
              void refreshSaves() {
                  saves.clear();si=0;
                  if(roms.empty()) return;
                  const auto& r=roms[ri];
                  const std::string stem=withExtension(baseName(r.path),"");
                  // Exact variants first, then saves of the same base Pokemon game.
                  for(int pass=0;pass<2;pass++) for(const auto& p:allSaves) {
                      int f=familyForSave(p);
                      if(f!=r.family&&!(sameFile(r.path,currentRom)&&sameFile(p,currentSave))) continue;
                      const bool exact=saveNameMatches(baseName(p),stem);
                      if(exact==(pass==0)) uniquePath(saves,p);
                  }
                  if(sameFile(r.path,currentRom)) for(size_t i=0;i<saves.size();i++) if(sameFile(saves[i],currentSave)) si=i;
              }
              void stepRom(int dir) {
                  if(roms.empty()) return;
                  ri=(ri+roms.size()+(dir>0?1:roms.size()-1))%roms.size();
                  committed=false;result.clear();refreshSaves();
              }
              void stepSave(int dir) {
                  if(saves.empty()) return;
                  si=(si+saves.size()+(dir>0?1:saves.size()-1))%saves.size();
                  committed=false;result.clear();
              }
              std::string romLabel() const {
                  if(roms.empty()) return "GBA ROM: none found";
                  return "ROM "+std::to_string(ri+1)+"/"+std::to_string(roms.size())+": "+shortName(roms[ri].path);
              }
              std::string saveLabel() const {
                  if(!result.empty()) return result;
                  if(saves.empty()) return "GBA save: none found";
                  return std::string(committed?"Save ":"A Save ")+std::to_string(si+1)+"/"+std::to_string(saves.size())+": "+shortName(saves[si]);
              }
              void apply() {
                  result.clear();
                  if(roms.empty()||saves.empty()) {result="GBA save: none found";return;}
                  if(gbaFamily(roms[ri].path)!=roms[ri].family||!pokemonGbaSave(saves[si])) {result="GBA source no longer valid";return;}
                  if(!writeIni(kSlot2Ini,"SLOT2","GBA_ROM_PATH",roms[ri].path,"GBA_SAV_PATH",saves[si])) {result="Could not write settings";return;}
                  currentRom=roms[ri].path;currentSave=saves[si];committed=true;
              }
          };
          } // namespace pokeSlots''')
          themes=[('dsimenutheme','72eefa9c4ff3ed6d2454b40e7ad923321a04e877','[CURPOS]','FontPalette::dialog'),('r4theme','60e83d8444fe338cbdfa7373960f6c407b385491','','highlighted'),('aktheme','f2774557c2981850667b1fbcafb856acf6358862','[cursorPosOnScreen]','highlighted')]
          for theme,sha,idx,palette in themes:
              p=root/f'romsel_{theme}/arm9/source/perGameSettings.cpp'; check(p,sha)
              replace(p,'\tstd::string migrationText = pokeSlots::migrationLabel(pokeRomPath);',f'''\tconst bool gbaSelector = !ms().secondaryDevice && showPerGameSettings && !isHomebrew{idx} && !isDSiWare{idx} && !isNdz{idx} && pokeSlots::isTransferSource(gameTid{idx}) && perGameOps < 24;
          	if (gbaSelector) {{ perGameOp[++perGameOps] = 24; perGameOp[++perGameOps] = 25; }}
          	pokeSlots::GbaSelector gbaSource(gbaSelector);
          	std::string migrationText = pokeSlots::migrationLabel(pokeRomPath);''')
              replace(p,f'\t\t\tcase 23:\n\t\t\t\tprintSmall(false, 0, perGameOpYpos, walkerText, Alignment::center, {palette});\n\t\t\t\tbreak;',f'''\t\t\tcase 23:
          				printSmall(false, 0, perGameOpYpos, walkerText, Alignment::center, {palette});
          				break;
          			case 24:
          				printSmall(false, 0, perGameOpYpos, gbaSource.romLabel(), Alignment::center, {palette});
          				break;
          			case 25:
          				printSmall(false, 0, perGameOpYpos, gbaSource.saveLabel(), Alignment::center, {palette});
          				break;''')
              replace(p,'\t\t\tif (held & KEY_LEFT) {\n\t\t\t\tswitch (perGameOp[perGameSettings_cursorPosition]) {','''\t\t\tif (held & KEY_LEFT) {
          				switch (perGameOp[perGameSettings_cursorPosition]) {
          					case 24: gbaSource.stepRom(-1); break;
          					case 25: gbaSource.stepSave(-1); break;''')
              replace(p,'\t\t\t\t\tcase 22:\n\t\t\t\t\t\tif (pressed & KEY_A) migrationText = pokeSlots::toggleMigrationBypass(pokeRomPath);','''\t\t\t\t\tcase 24:
          						if (pressed & KEY_A) {
          							if (perGameOp[perGameSettings_cursorPosition+1]==25) {
          								perGameSettings_cursorPosition++;
          								if (perGameSettings_cursorPosition>firstPerGameOpShown+3) firstPerGameOpShown++;
          							}
          						} else gbaSource.stepRom(1);
          						break;
          					case 25:
          						if (pressed & KEY_A) gbaSource.apply();
          						else gbaSource.stepSave(1);
          						break;
          					case 22:
          						if (pressed & KEY_A) migrationText = pokeSlots::toggleMigrationBypass(pokeRomPath);''')
          pathlib.Path('out/menu-selector.patch').write_bytes(subprocess.check_output(['git','-C','upstream','diff','--binary']))
          PY
      - name: Build menu theme in legacy devkitARM
        shell: bash
        env:
          THEME: ${{ matrix.theme }}
        run: |
          set -euo pipefail
          docker pull devkitpro/devkitarm:20241104
          docker run --rm -e THEME -v "$PWD:/src" -w /src/upstream/TWiLightMenu-27.25.1 devkitpro/devkitarm:20241104 bash -ec '
            export DEVKITPRO=/opt/devkitpro
            export DEVKITARM=$DEVKITPRO/devkitARM
            export LIBNDS=$DEVKITPRO/libnds
            export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
            arm-none-eabi-gcc --version
            find . -type d -name build -prune -exec rm -rf {} +
            # DATA is expanded when the ARM9 submake starts; ensure binary inputs exist first.
            make -C "romsel_$THEME" -j1 bootloader bootstub
            test -s "romsel_$THEME/data/load.bin"
            test -s "romsel_$THEME/data/bootstub.bin"
            make -C "romsel_$THEME" -j2 all
          ' 2>&1 | tee out/build.log
      - name: Validate and package menu only
        shell: bash
        env:
          THEME: ${{ matrix.theme }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,struct,shutil,hashlib,json
          out=pathlib.Path('out')
          theme=os.environ['THEME']; target=os.environ['TARGET']
          root=pathlib.Path('upstream')
          nds=root/'TWiLightMenu-27.25.1'/('romsel_'+theme)/('romsel_'+theme+'.nds')
          b=nds.read_bytes()
          for off in (0x20,0x30):
              start,entry,dest,size=struct.unpack_from('<4I',b,off)
              assert size and start>=512 and start+size<=len(b) and dest<=(entry&~1)<dest+size
          assert b'GBA save: none found' in b and b'GBA source no longer valid' in b
          pkg=out/'package'; folder=pkg/'_nds/TWiLightMenu';folder.mkdir(parents=True)
          shutil.copyfile(nds,folder/(target+'.srldr'))
          shutil.copyfile(out/'menu-selector.patch',pkg/'menu-selector.patch')
          for n in ('LICENSE','CREDITS.md'):
              shutil.copyfile(root/n,pkg/n)
          (pkg/'README-TEST.txt').write_text('TWLM02: replace only the matching theme .srldr. Y on Gen IV Pokemon on SD. Choose ROM with left/right then A moves to Save; choose save with left/right and A commits both paths to global slot2.ini. B without Save+A discards preview. Scans sd:/roms/gba recursively (depth 6), configured ROM/save directories and TWiLightMenu/saves; bounded to 128 directories and 1024 candidate files. All Pokemon GBA ROMs retaining AXV/AXP/BPE/BPR/BPG header families are listed even without saves. Save candidates are 128 KiB or +16 RTC, ranked by matching variant filename then same base game by filename; no content-level save family verification. Names shortened for display; copies and patched variants are not deduplicated by game ID. Generic unmatched saves are omitted except the current configured pair. Does not edit save contents. Keep NBP011 bootstrap unchanged. Hardware test pending. Source: Shinygati/SD-Transporter 75610fa9905ac252609081287121e8d4c44febed; see patch and credits.\n')
          (pkg/'build-report.json').write_text(json.dumps({'theme':theme,'sha256':hashlib.sha256(b).hexdigest(),'hardware_tested':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TWLM02-${{ matrix.target }}-test
          path: out/package
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TWLM02-${{ matrix.target }}-diagnostics
          path: |
            out/build.log
            out/menu-selector.patch
