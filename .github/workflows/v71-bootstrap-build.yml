            core/bootstrap/retail/cardengine/arm9/build/*.map
            core/bootstrap/retail/cardengine/arm9_32/build/*.map
          if-no-files-found: ignore
          retention-days: 7

          echo "Both PING-only routines are compiled into the DSi ARM9 cardengine." >> "$GITHUB_STEP_SUMMARY"
          echo "They are not yet called by a runtime Wi-Fi backend." >> "$GITHUB_STEP_SUMMARY"
      - name: Restore missing official preload configuration data (pinned)
        shell: bash
        env:
          UPSTREAM_COMMIT: f6728baaa28a6fffbd070badce60d0b470180e1e
