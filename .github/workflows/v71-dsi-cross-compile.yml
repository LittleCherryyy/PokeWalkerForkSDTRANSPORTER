name: V7.1 experimental DSi NTR cross-compile

# Legacy compatibility gate for the V7.1 branch. Reuse the pinned,
# already-tested NTR source pipeline instead of installing host GCC
# from retired Bullseye package revisions (apt security mirror 404).
# No console-ready binary or save is published.
on:
  push:
    branches:
      - dev/v71-network-readiness-diagnostics
    paths:
      - '.github/workflows/v71-dsi-cross-compile.yml'
      - 'core/bootstrap/retail/cardenginei/arm7/source/**'
      - 'core/bootstrap/retail/cardenginei/arm9_igm/source/**'
      - 'core/bootstrap/retail/common/include/walker_*.h'
      - 'core/bootstrap/retail/common/source/walker_hgss_net.c'
      - 'core/bootstrap/retail/bootloaderi/source/arm7/walker_*.c'
  pull_request:
    paths:
      - '.github/workflows/v71-dsi-cross-compile.yml'
      - 'core/bootstrap/retail/cardenginei/arm7/source/**'
      - 'core/bootstrap/retail/cardenginei/arm9_igm/source/**'
      - 'core/bootstrap/retail/common/include/walker_*.h'
      - 'core/bootstrap/retail/common/source/walker_hgss_net.c'
      - 'core/bootstrap/retail/bootloaderi/source/arm7/walker_*.c'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dsi-cross-compile:
    uses: ./.github/workflows/pokewalker-ntr-build.yml
    with:
      upload_unverified_artifact: false
