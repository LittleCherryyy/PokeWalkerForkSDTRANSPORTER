name: Build V7.1 DSi Android hotspot diagnostic

on:
  push:
    branches:
      - "dev/v7.1-*"
    paths:
      - "diagnostics/dsi_lan_ping_v71/**"
      - "diagnostics/dsi_ping_v6/**"
      - ".github/workflows/v71-dsi-lan-build.yml"
      - "core/bootstrap/retail/common/include/walker_*.h"
      - "tools/v7_1/check_shared_layout.c"
  pull_request:
    paths:
      - "diagnostics/dsi_lan_ping_v71/**"
      - "diagnostics/dsi_ping_v6/**"
      - ".github/workflows/v71-dsi-lan-build.yml"
      - "core/bootstrap/retail/common/include/walker_*.h"
      - "tools/v7_1/check_shared_layout.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dsi-nds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared ARM7/ARM9 control layout (compile only)
        shell: bash
        run: |
          set -euo pipefail
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc \
            -std=gnu11 -mcpu=arm946e-s -marm \
            -ffreestanding -Wall -Wextra -Werror -fsyntax-only \
            -Icore/bootstrap/retail/common/include \
            -I/opt/devkitpro/libnds/include \
            tools/v7_1/check_shared_layout.c
      - name: Compile virtual walker payload with new shared ABI (syntax only)
        shell: bash
        run: |
          set -euo pipefail
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc \
            -std=gnu11 -mcpu=arm946e-s -marm -Os \
            -ffreestanding -fno-builtin -Wall -Wextra -Werror -fsyntax-only \
            -Icore/bootstrap/retail/common/include \
            core/bootstrap/retail/pokewalker/walker.c
      - name: Build safe DSi diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cp -a diagnostics/dsi_ping_v6 /tmp/pokewalker-v71-dsi
          cp diagnostics/dsi_lan_ping_v71/source/main.c /tmp/pokewalker-v71-dsi/source/main.c
          cd /tmp/pokewalker-v71-dsi
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          make -j2
          test -s PokeWalker_DSi_V6_Direct_PING.nds
          cp PokeWalker_DSi_V6_Direct_PING.nds "${GITHUB_WORKSPACE}/PokeWalker_V71_HOTSPOT_PING.nds"
      - name: Upload test .nds artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeWalker-V71-HOTSPOT-PING
          path: PokeWalker_V71_HOTSPOT_PING.nds
          if-no-files-found: error
          retention-days: 30
