  dsi-cross-compile:
    needs: host-checks
    name: DSi ARM7 + IGM legacy toolchain compile (no publish)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20241104
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download static host LZSS from successful host job
        uses: actions/download-artifact@v4
        with:
          name: v72-lzss-host-linux-x86_64
          path: core/bootstrap
      - name: Compile DSi NTR components
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export COMPILER_DIR=/opt/devkitpro/devkitARM
          export SDK_DIR=/opt/devkitpro/libnds
          export PATH="$COMPILER_DIR/bin:$DEVKITPRO/tools/bin:$PATH"
          arm-none-eabi-gcc --version | head -1
          test -f "$SDK_DIR/include/nds.h"
          # Native tool is a static x86_64 binary built on the Ubuntu runner.
          # The pinned Debian image needs no apt indexes or host C compiler.
          chmod +x core/bootstrap/lzss
          test -x core/bootstrap/lzss
          make -C core/bootstrap/retail -j2 \
            DEVKITARM="$GITHUB_WORKSPACE/core/bootstrap/portable-ds-rules" \
            LEGACY_DEVKITARM="$COMPILER_DIR" LEGACY_LIBNDS="$SDK_DIR" LIBDIRS="$SDK_DIR" \
            PYTHON=python3 GIT_VER=sdlang2 LZSS="$GITHUB_WORKSPACE/core/bootstrap/lzss" \
            cardenginei_arm7 cardenginei_arm9_igm
      - name: Rebuild complete nds-bootstrap (no release)
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export COMPILER_DIR=/opt/devkitpro/devkitARM
          export SDK_DIR=/opt/devkitpro/libnds
          export PATH="$COMPILER_DIR/bin:$DEVKITPRO/tools/bin:$PATH"
          # The repo already ships compiled preload pack assets, but does not
          # include preLoadSettings/files-mep. Do not invent missing inputs.
          # Reuse only if all 13 expected assets exist and are non-empty.
          cd core/bootstrap/retail
          for part in MEP DSi DSi-en DSi-fr DSi-de DSi-it DSi-es \
                      3DS 3DS-en 3DS-fr 3DS-de 3DS-it 3DS-es; do
            test -s "nitrofiles/preLoadSettings${part}.pck"
          done
          # Other archive packers also have missing source directories in
          # this tree. Only reuse existing, non-empty checked-in packages.
          for part in apfix mobiclipOffsets dsi2dsSavePatches; do
            test -s "nitrofiles/${part}.pck"
          done
          cat > /tmp/v71-pack-override.mk <<'EOF'
          .PHONY: preLoadSettings apfix mobiclipOffsets dsi2dsSavePatches
          preLoadSettings apfix mobiclipOffsets dsi2dsSavePatches:
          	@echo "Reusing checked-in binary pack assets; sources absent or incomplete"
          EOF
          make -f Makefile -f /tmp/v71-pack-override.mk -j2 \
            DEVKITARM="$GITHUB_WORKSPACE/core/bootstrap/portable-ds-rules" \
            LEGACY_DEVKITARM="$COMPILER_DIR" LEGACY_LIBNDS="$SDK_DIR" LIBDIRS="$SDK_DIR" \
            PYTHON=python3 GIT_VER=sdlang2 LZSS="$GITHUB_WORKSPACE/core/bootstrap/lzss" all
          test -s bin/nds-bootstrap.nds
          echo "Full build succeeded; V8.8 guarded 6-word NitroSDK2 legacy thread-info layout snapshot. No Wi-Fi, no save I/O."
          # Verify no accidental radio library linked into this retail image.
          if arm-none-eabi-nm cardenginei/arm7/build/cardenginei_arm7.elf 2>/dev/null | grep -E "Wifi_Init|socConnect|walkerPingStep"; then
            echo "ERROR: unexpected V7.2 radio/PING symbol linked into ARM7" >&2
            exit 1
          fi
      - name: Create SHA-256 checksum for diagnostic build
        shell: bash
        run: |
          cd core/bootstrap/retail/bin
          sha256sum nds-bootstrap.nds > nds-bootstrap.nds.sha256
          cat nds-bootstrap.nds.sha256
      - name: Upload experimental DSi menu diagnostic artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: v88-hgss-arm9-legacy-thread-info-six-word-readonly-test-only
          path: |
            core/bootstrap/retail/bin/nds-bootstrap.nds
            core/bootstrap/retail/bin/nds-bootstrap.nds.sha256
          if-no-files-found: error
          retention-days: 7
