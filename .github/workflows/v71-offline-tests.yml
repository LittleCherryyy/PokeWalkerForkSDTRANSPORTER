name: V7.1 offline analysis tests

on:
  push:
    branches:
      - "dev/v7.1-*"
    paths:
      - "tools/v7_1/**"
      - ".github/workflows/v71-offline-tests.yml"
  pull_request:
    paths:
      - "tools/v7_1/**"
      - ".github/workflows/v71-offline-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify C bridge / Java protocol interoperability
        shell: bash
        run: |
          mkdir -p /tmp/v71-interop
          cc -std=c11 -Wall -Wextra -Werror tools/v7_1/c_bridge_ping.c -o /tmp/v71-interop/c_bridge_ping
          /tmp/v71-interop/c_bridge_ping /tmp/v71-interop/ping.bin
          javac -d /tmp/v71-interop \
            core/android/app/src/main/java/io/github/sdtransporter/pokewalker/DirectSyncProtocol.java \
            tools/v7_1/ProtocolInteropTest.java
          java -cp /tmp/v71-interop io.github.sdtransporter.pokewalker.ProtocolInteropTest /tmp/v71-interop/ping.bin
      - name: Compile offline tools
        run: python -m compileall -q tools/v7_1
      - name: Audit resident HGSS networking gates (informational)
        run: python tools/v7_1/resident_audit.py --json --require-fail-closed
      - name: Validate fail-closed HGSS WCM/SOCL research manifest
        run: python tools/v7_1/verify_network_symbols.py
      - name: Execute DSi ARM9 PING-only runtime fixture (native host)
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror \
            -Icore/bootstrap/retail/common/include \
            core/bootstrap/retail/cardenginei/arm9/source/walker_ping_diagnostic.c \
            tools/v7_1/test_ping_runtime.c -o /tmp/v71-interop/ping-runtime-test
          /tmp/v71-interop/ping-runtime-test
      - name: Unit tests with synthetic binaries only
        run: python -m unittest discover -s tools/v7_1 -p 'test_*.py' -v
