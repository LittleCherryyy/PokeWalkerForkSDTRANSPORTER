name: V7.1 offline analysis tests

on:
  push:
    branches:
      - "dev/v7.1-*"
    paths:
      - "tools/v7_1/**"
      - ".github/workflows/v71-offline-tests.yml"
  pull_request:
    paths:
      - "tools/v7_1/**"
      - ".github/workflows/v71-offline-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile offline tools
        run: python -m compileall -q tools/v7_1
      - name: Unit tests with synthetic binaries only
        run: python -m unittest discover -s tools/v7_1 -p 'test_*.py' -v
